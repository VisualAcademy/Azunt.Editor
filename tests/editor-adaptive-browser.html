<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><title>Azunt.Editor browser checks</title>
</head>
<body>
<div class="az-azunt-editor" data-azunt-editor="true" data-read-only="false" data-toolbar-mode="compact" id="browser-test">

<input data-link-text=""/><input data-link-url=""/><button data-link-apply="">Apply</button><button data-link-cancel="">Cancel</button>
</div>
<div class="az-azunt-editor-find-panel" data-find-panel="" hidden="">

<button data-find-next="">Find next</button><button data-find-replace="">Replace</button>
<button data-find-all="">Replace all</button><button data-find-close="">Close</button>
<span data-find-status=""></span>
</div>
<div class="az-azunt-editor-chars-panel" data-chars-panel="" hidden="">

<button data-insert-character="✓" type="button">✓</button>
<button data-chars-close="" type="button">Close</button>
</div>

<input data-azunt-images="" hidden="" multiple="" type="file"/>
